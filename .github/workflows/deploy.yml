name: Deploy Travel Book Covers to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'travel-book-covers/**'
      - '.github/workflows/deploy.yml'
      - 'index.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: travel-book-covers/package-lock.json

      - name: Install dependencies
        working-directory: travel-book-covers
        run: npm ci

      - name: Build
        working-directory: travel-book-covers
        run: npm run build

      - name: Copy root site files into dist
        run: |
          cp index.html travel-book-covers/dist/
          cp -r loveflix_template travel-book-covers/dist/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: travel-book-covers/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
